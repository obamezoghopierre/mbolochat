name: ci

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbolochat
          POSTGRES_PASSWORD: mbolochat
          POSTGRES_DB: mbolochat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbolochat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mbolochat:mbolochat@localhost:5432/mbolochat
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer ffmpeg pour les tests média
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Installer les dépendances
        run: npm ci
      - name: Lint API (informatif pendant la résorption de la dette)
        continue-on-error: true
        run: npm run lint
      - name: Vérifier les types API
        run: npx tsc --noEmit
      - name: Tests unitaires API
        run: npm test
      - name: Tests e2e API
        run: npm run test:e2e

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types mobile
        run: npx tsc --noEmit
      - name: Tests unitaires mobile
        run: npm test
      - name: Contrôler les assets et emoji
        run: node --test tests/*.test.mjs
      - name: Lint mobile (informatif pendant la résorption de la dette)
        continue-on-error: true
        run: npx expo lint
